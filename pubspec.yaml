name: local_hub
description: "A map-based local restaurant discovery and food journal app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  http: ^1.2.0
  html: ^0.15.6
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  latlong2: ^0.9.1
  provider: ^6.1.5+1
  sqflite: ^2.4.2
  path: ^1.9.1
  url_launcher: ^6.2.5
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  audioplayers: ^6.6.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/local_hub_app_icon.png"
  remove_alpha_ios: true
